[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxsound"
version = "0.1.0"
description = "Hear eddy-covariance data: the sound tools of fluxscale, and web apps built on them"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.8"
dependencies = ["fluxscale>=0.6"]

[project.optional-dependencies]
midi = ["fluxscale[midi]>=0.6"]

[project.scripts]
fluxsound = "fluxscale.main:sonify"

[project.urls]
Homepage = "https://github.com/pedrohenriquecoimbra/FluxSound"

[tool.setuptools.packages.find]
where = ["src"]
