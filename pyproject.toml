[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxsound"
version = "0.1.0"
description = "Hear eddy-covariance data: sonification built on waveletec"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.9"
dependencies = [
    # PyPI stops at 0.4; this project needs 0.5 from the repository.
    "waveletec @ git+https://github.com/pedrohenriquecoimbra/wavelet-ec.git",
    "numpy>=1.24",
    "pandas>=2.0.0",
    "PyWavelets>=1.4.0",
    "scipy>=1.10.0",
    "xarray",
]

[project.optional-dependencies]
apps = ["soundfile>=0.12", "matplotlib", "zarr", "fsspec", "aiohttp"]
midi = ["mido>=1.3"]
test = ["pytest", "mido>=1.3"]

[project.scripts]
fluxsound = "fluxsound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
