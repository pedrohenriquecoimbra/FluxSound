# Builds both apps and serves them with GitLab Pages. The site goes live after
# the first successful run on the default branch.
pages:
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - python scripts/build_all.py
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
